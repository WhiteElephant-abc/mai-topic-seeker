# 找话题的麦麦 —— 插件配置
# 改完保存即生效（宿主会热重载插件配置，无需重启容器）。

[plugin]
enabled = true
config_version = "1.0.0"
version = "1.0.0"

[scheduler]
enabled = true
start_time = "08:00"          # 每日开始时间
end_time = "23:30"            # 每日结束时间；小于开始时间表示跨夜
check_interval = 25           # 检查间隔（分钟）
jitter = 5                    # 间隔抖动（分钟），实际间隔在 25±5 分钟内随机
probability = 0.6             # 冷场成立后，本次触发的概率
idle_minutes = 45             # 距最后一条真人消息超过 45 分钟才算冷场
min_interval_between_chats = 90   # 两次主动之间的最小间隔（分钟）
lookback_hours = 72           # 回看多久的消息来判断是否冷场

[target]
platform = "qq"
allowed_groups = []           # 例：["123456789"]，留空则群聊不生效
allowed_friends = []          # 例：["10001"]，留空则私聊不生效
allow_create_session = false  # 数据库里查不到会话时是否允许新建，一般不需要开

[intent]
# 支持 {nickname} {idle_minutes} {time} {date} 占位符
text = "群里安静了一会儿了。你可以主动起个话头，或者接着之前没聊完的话题往下说。"
reason = "topic_seeker"
